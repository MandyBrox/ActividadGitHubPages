<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="Amanda Garcia Fernandez_Tarea HTML+CSS_Todo(CSS).css">
    <title>AventuraPark 2026 · Reservas</title>
  </head>
  
  <body>
        <header>
        <h1 class="tituloPrincipal">AventuraPark 2026</h1>
        <p class="pCabecera">Tu día de adrenalina, espectáculos y diversión en familia</p>
      
        <nav>
          <ul>
            <li class="menu"><a href="Amanda Garcia Fernandez_Tarea HTML+CSS_Todo(Página Principal).html">Información</a></li>
          </ul>
        </nav>
      </header>
    
    <section class="seccion">
      
      <h2 class="tituloSecundario">Reserva tu entrada</h2>
      
    <form>
      <fieldset>
        <legend class="tituloSecForm">Datos del visitante</legend>
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Ana" required minlength="3" maxlength="50">
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" placeholder="Ej: García López"required minlength="3" maxlength="50">
        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" placeholder="12345678A" pattern="[0-9]{8}[A-Z]" required>
        <label for="mail">Email:</label>
        <input type="email" id="mail" name="mail" placeholder="nombre@correo.es"required>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="9 dígitos" pattern="[0-9]{9}" required>
        <label for="ciudad">Ciudad (fija):</label>
        <input type="text" id="ciudad" name="ciudad" value="Valencia" required>
      </fieldset>
      
      <fieldset>
        <legend class="tituloSecForm">Preferencias de visita</legend>
        
        <label for="fecha" class="visita">Fecha de visita:</label>
        <input type="date" id="fecha" name="fecha"/>
        <br>
        <label for="hora" class="visita">Hora aproximada de llegada:</label>
        <input type="time" id="hora" name="hora"/>
        <br>
        <label for="entrada" class="visita">Tipo de entrada:</label>
        <select>
          <option>General</option>
          <option>Reducida</option>
          <option>VIP</option>
          <option disabled>Grupo (no disponible)</option>
        </select>
        <br>
        <label for="interes" class="visita visitaEspecial">Zonas de interés:</label>
        <input type="checkbox" name="interés" value="Aventura"/>
        <label>Aventura</label>
        <input type="checkbox" name="interés" value="Family"/>
        <label>Family</label>
        <input type="checkbox" name="interés" value="Oscura"/>
        <label>Oscura</label>
        <br>
        <label for="emocion" class="visita visitaEspecial">Nivel de emoción:</label>
        <input type="radio" name="emocion" value="Suave" required>
        <label>Suave</label>
        <input type="radio" name="emocion" value="Medio"/>
        <label>Medio</label>
        <input type="radio" name="emocion" value="Alto"/>
        <label>Alto</label>
        <br>
        <label class="visita">Comentarios:</label>
        <textarea placeholder="Escriba aquí, por favor (20-200 caracteres)" rows="6" cols="60" minlength="20" maxlength="200"></textarea>
        <br>
        <label class="visita">Código descuento (bloqueado):</label>
        <input type="text" placeholder="NO_DISPONIBLE" disabled>
      </fieldset>
      
      <button type="submit"id="enviar">Enviar</button>
      <button type="reset" id="borrar">Borrar</button>
    
    
    </form>
    </section>
    
    <footer>
    <p>AventuraPark 2026 · Av. Diversión, 12 · Contacto: info@aventurapark.es</p>
    </footer>
  
  </body>
</html>
